[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentive-py-service"
version = "0.1.0"
description = "Agentive AI service (LLM orchestration, RAG, tools) for the Car Rental platform"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128",
    "uvicorn[standard]>=0.39",
    "pydantic-settings>=2.11",
    "python-dotenv>=1.2",
    "openai>=2.48",
    "pdfplumber>=0.11",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "qdrant-client>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
